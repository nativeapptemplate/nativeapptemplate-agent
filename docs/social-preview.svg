<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Palette 9: Friendly - Light Blue Vivid (matches nativeapptemplateapi) -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2933"/>
      <stop offset="100%" stop-color="#0B69A3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#40C3F7"/>
      <stop offset="100%" stop-color="#2BB0ED"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <circle cx="1050" cy="180" r="180" fill="#40C3F7" opacity="0.22"/>
  <circle cx="1150" cy="450" r="140" fill="#5ED0FA" opacity="0.15"/>

  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>

  <!-- Built with Opus 4.7 badge -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="270" height="44" rx="22" fill="#127FBF"/>
    <text x="135" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#E3F8FF" text-anchor="middle">★ BUILT WITH OPUS 4.7</text>
  </g>

  <!-- Title -->
  <text x="80" y="240" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="76" font-weight="800" fill="#F5F7FA" letter-spacing="-2">NativeAppTemplate</text>
  <text x="80" y="310" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="56" font-weight="700" fill="url(#accent)" letter-spacing="-1">Agent</text>

  <!-- Tagline -->
  <text x="80" y="390" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="400" fill="#CBD2D9">Natural-language spec to native</text>
  <text x="80" y="432" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="400" fill="#CBD2D9">iOS + Android + Rails API</text>

  <!-- Tech pills -->
  <g transform="translate(80, 500)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="600">
    <g>
      <rect x="0" y="0" width="140" height="44" rx="22" fill="#323F4B" stroke="#52606D" stroke-width="1"/>
      <text x="70" y="29" fill="#F5F7FA" text-anchor="middle">TypeScript</text>
    </g>
    <g transform="translate(155, 0)">
      <rect x="0" y="0" width="90" height="44" rx="22" fill="#323F4B" stroke="#52606D" stroke-width="1"/>
      <text x="45" y="29" fill="#F5F7FA" text-anchor="middle">Ruby</text>
    </g>
    <g transform="translate(260, 0)">
      <rect x="0" y="0" width="80" height="44" rx="22" fill="#323F4B" stroke="#52606D" stroke-width="1"/>
      <text x="40" y="29" fill="#F5F7FA" text-anchor="middle">iOS</text>
    </g>
    <g transform="translate(355, 0)">
      <rect x="0" y="0" width="130" height="44" rx="22" fill="#323F4B" stroke="#52606D" stroke-width="1"/>
      <text x="65" y="29" fill="#F5F7FA" text-anchor="middle">Android</text>
    </g>
    <g transform="translate(500, 0)">
      <rect x="0" y="0" width="80" height="44" rx="22" fill="#323F4B" stroke="#52606D" stroke-width="1"/>
      <text x="40" y="29" fill="#F5F7FA" text-anchor="middle">MIT</text>
    </g>
  </g>

  <!-- Right visual: spec prompt → three platform outputs -->
  <g transform="translate(860, 140)">
    <!-- Spec prompt card -->
    <g>
      <rect x="0" y="0" width="340" height="120" rx="20" fill="#1B2A38" stroke="#40C3F7" stroke-width="2.5"/>
      <text x="20" y="40" font-family="SF Mono, Menlo, monospace" font-size="18" font-weight="700" fill="#5ED0FA">spec:</text>
      <text x="20" y="76" font-family="-apple-system, sans-serif" font-size="22" font-weight="600" fill="#F5F7FA">&quot;a walk-in queue for a</text>
      <text x="20" y="104" font-family="-apple-system, sans-serif" font-size="22" font-weight="600" fill="#F5F7FA">barbershop&quot;</text>
    </g>

    <!-- Connection lines fan out to three platforms -->
    <line x1="80" y1="120" x2="55" y2="170" stroke="url(#accent)" stroke-width="3" opacity="0.85"/>
    <line x1="170" y1="120" x2="170" y2="170" stroke="url(#accent)" stroke-width="3" opacity="0.85"/>
    <line x1="260" y1="120" x2="285" y2="170" stroke="url(#accent)" stroke-width="3" opacity="0.85"/>

    <!-- Rails server card -->
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="110" height="180" rx="14" fill="#1F2933" stroke="#3E4C59" stroke-width="2"/>
      <text x="55" y="78" font-family="SF Mono, Menlo, monospace" font-size="34" font-weight="700" fill="#40C3F7" text-anchor="middle">&lt;/&gt;</text>
      <text x="55" y="125" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#40C3F7" text-anchor="middle">Rails</text>
      <text x="55" y="150" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#B3ECFF" text-anchor="middle">API</text>
    </g>

    <!-- iOS device -->
    <g transform="translate(120, 170)">
      <rect x="0" y="0" width="100" height="180" rx="20" fill="#1F2933" stroke="#3E4C59" stroke-width="2"/>
      <rect x="8" y="8" width="84" height="164" rx="14" fill="#323F4B"/>
      <rect x="38" y="18" width="24" height="8" rx="4" fill="#0B69A3"/>
      <text x="50" y="105" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#40C3F7" text-anchor="middle">iOS</text>
    </g>

    <!-- Android device -->
    <g transform="translate(230, 170)">
      <rect x="0" y="0" width="100" height="180" rx="14" fill="#1F2933" stroke="#3E4C59" stroke-width="2"/>
      <rect x="8" y="8" width="84" height="164" rx="8" fill="#323F4B"/>
      <circle cx="50" cy="20" r="3" fill="#0B69A3"/>
      <text x="50" y="105" font-family="sans-serif" font-size="13" font-weight="700" fill="#40C3F7" text-anchor="middle">ANDROID</text>
    </g>
  </g>

  <!-- Footer URL — baseline at y=585 keeps text bottom inside the 40pt safe area -->
  <text x="80" y="585" font-family="SF Mono, Menlo, monospace" font-size="20" font-weight="500" fill="#7B8794">github.com/nativeapptemplate/nativeapptemplate-agent</text>
</svg>
